```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ajudante</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div class="brand">

                <div class="orb"></div>

                <div>
                    <h1>AJUDANTE</h1>
                    <span>ONLINE</span>
                </div>

            </div>

            <div id="clock">
                00:00
            </div>

        </header>


        <main id="conversation">

            <div class="message assistant">

                <div class="name">
                    AJUDANTE
                </div>

                <p>
                    Olá. Eu sou o Ajudante.
                </p>

                <small>
                    Estou pronto para conversar com você.
                </small>

            </div>

        </main>


        <div class="input-area">

            <button id="micButton">
                🎙
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Digite uma mensagem..."
                autocomplete="off"
            >

            <button id="sendButton">
                ➤
            </button>

        </div>


        <footer>
            <span>SISTEMA</span>

            <span id="status">
                Aguardando comando
            </span>
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
