```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ajudante</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- CABEÇALHO -->

        <header class="header">

            <div class="brand">

                <div class="status-orb"></div>

                <div>
                    <h1>AJUDANTE</h1>
                    <span id="status">ONLINE</span>
                </div>

            </div>

            <div class="clock" id="clock">
                00:00
            </div>

        </header>


        <!-- ÁREA DA CONVERSA -->

        <section class="conversation" id="conversation">

            <div class="message assistant">

                <div class="message-name">
                    AJUDANTE
                </div>

                <p>
                    Olá. Estou pronto para conversar com você.
                </p>

                <span class="message-time">
                    agora
                </span>

            </div>

        </section>


        <!-- ÁREA DE COMANDO -->

        <section class="input-area">

            <button
                class="icon-button"
                id="microphone"
                title="Microfone">

                🎙

            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Fale comigo..."
                autocomplete="off"
            >

            <button
                class="send-button"
                id="sendButton">

                ➤

            </button>

        </section>


        <!-- STATUS -->

        <footer class="footer">

            <span>
                SISTEMA
            </span>

            <span id="systemStatus">
                Aguardando comando
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
```
